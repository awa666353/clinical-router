<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>患者视角 · Laya 问诊演练</title>
  <link rel="stylesheet" href="/assets/styles.css" />
  <link rel="stylesheet" href="/assets/patient.css" />
  <link rel="stylesheet" href="/assets/game.css" />
</head>
<body class="game-body">
  <main class="patient-wrap">
    <div class="patient-head">
      <div>
        <div class="tiny muted"><a href="/">✳ Laya 问诊演练</a> / 患者视角</div>
        <div class="patient-title" id="patient-title">进入角色，回答医生</div>
      </div>
      <span class="pill ok" id="status-pill">连接中</span>
    </div>

    <div class="patient-complaint">
      <div class="tiny muted">您刚才描述的主要不适</div>
      <div id="chief-complaint" class="patient-complaint-value">胸痛</div>
    </div>

    <section id="patient-brief" class="patient-game-brief hidden"></section>
    <section class="patient-chat" id="chat"></section>
  </main>

  <div class="patient-composer">
    <div class="patient-composer-inner">
      <div class="patient-composer-main">
        <div class="quick">
          <button data-text="我不知道">我不知道</button>
          <button data-text="不想回答这个问题" data-status="refused">不想回答</button>
          <button data-text="没太听懂，可以换个说法吗">没听懂</button>
          <button data-text="没有这种情况">没有</button>
          <button data-text="暂时没有回答" data-status="no_response">未回答</button>
        </div>
        <textarea id="answer" rows="2" placeholder="在这里输入回答，医生会看到…"></textarea>
      </div>
      <div></div>
      <button class="btn primary" id="send">发送回答</button>
    </div>
  </div>

  <script src="/assets/app.js" defer></script>
  <script src="/assets/page-patient.js?v=3" defer></script>
</body>
</html>
