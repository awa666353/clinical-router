<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>医生视角 · Laya 问诊演练</title>
  <link rel="stylesheet" href="/assets/styles.css" />
  <link rel="stylesheet" href="/assets/game.css?v=4" />
</head>
<body class="game-body">
  <main class="game-workspace">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">✳</div><div>医生视角 <span class="tiny muted">· 问诊演练</span></div></div>
    <div class="top-actions">
      <span class="pill" id="encounter-pill">加载中…</span>
      <span class="pill" id="current-user">—</span>
      <a class="btn small ghost" href="/">新开一局</a>
    </div>
  </header>

    <section class="card doctor-summary">
      <div>
        <div class="tiny muted" id="roleplay-title">当前病例 · 医生只知道主诉</div>
        <div id="chief-complaint" class="chief-value">胸痛</div>
      </div>
      <span class="pill" id="patient-mode-pill">准备中</span>
    </section>

    <section class="game-invite hidden" id="invite-panel">
      <b>邀请另一位玩家扮演患者</b>
      <p>复制下方链接发给对方。病历卡只会出现在患者页面。</p>
      <div class="game-invite-line"><input id="invite-link" type="text" readonly aria-label="患者邀请链接" /><button class="btn primary small" id="copy-invite" type="button">复制患者链接</button></div>
    </section>

    <section class="game-doctor hidden" id="game-doctor">
      <div class="game-score-column">
        <aside class="card score-card" aria-live="polite">
          <div class="game-eyebrow">你的当前得分</div>
          <div class="score-number" id="game-score">0</div>
          <div class="score-unit">分</div>
          <p class="score-status" id="score-status">等待第一轮问答</p>
        </aside>
        <section class="card game-notes-card" aria-label="每轮自动病历">
          <div class="game-eyebrow">AI 自动整理病历</div>
          <p class="tiny muted">仅整理对话中患者实际说出的内容</p>
          <div id="game-round-notes" class="game-round-notes"><div class="empty">完成第一轮问答后显示病历。</div></div>
        </section>
      </div>
      <section class="card free-chat-card">
        <div class="section-title"><h2>问诊现场</h2><span class="tiny muted" id="game-turn-count">0 条对话</span></div>
        <div class="chat-log" id="game-chat-log"><div class="empty">患者已经就位。你想先问什么？</div></div>
        <label class="label" for="game-question">直接向患者提问</label>
        <textarea id="game-question" rows="3" maxlength="500" placeholder="例如：胸口不舒服是从什么时候开始的？"></textarea>
        <div class="composer-row">
          <span class="tiny muted" id="game-waiting-hint">患者回答后，AI 先整理病历，再自动计分。</span>
          <button class="btn primary" id="game-send-question" type="button">发送问题</button>
        </div>
      </section>
    </section>

    <section class="workspace hidden" id="legacy-workspace">
      <aside class="card side-card">
        <div class="section-title"><h3>选择问诊线索</h3><span class="tiny muted" id="fact-count">–</span></div>
        <div class="game-progress"><span id="fact-progress"></span></div>
        <p class="tiny muted" id="progress-label">选择一个线索开始提问</p>
        <div class="fact-list" id="fact-list"><div class="empty">加载中…</div></div>
      </aside>

      <section class="card chat-card">
        <div class="section-title">
          <h2>问诊现场</h2>
          <span class="tiny muted" id="turn-count"></span>
        </div>
        <div class="chat-log" id="chat-log"><div class="empty">选择左侧一个事实开始采集。</div></div>

        <div id="attempt-panel" class="hidden">
          <div class="current-question" id="current-question"></div>
          <div class="composer">
            <div id="question-editor"></div>
            <div class="composer-row">
              <div class="muted tiny" id="channel-hint"></div>
              <button class="btn primary" id="send-question-btn">发送问题给患者</button>
            </div>
            <div id="manual-answer-panel">
              <div class="divider"></div>
              <label class="label" for="answer-text">患者回答（常规采集时可由医生代录）</label>
              <textarea id="answer-text" rows="3" placeholder="例如：像石头压着一样，已经持续十几分钟了"></textarea>
              <div class="composer-row">
                <span class="muted tiny">回答写入后立即返回；事实抽取在后台异步完成。</span>
                <button class="btn primary" id="submit-answer-btn">提交回答并抽取</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <details class="card ledger-card" id="ledger-panel">
        <summary>采集记录与人工记录</summary>
        <div id="ledger"><div class="empty">尚未开始当前 attempt。</div></div>
      </details>
    </section>
  </main>

  <script src="/assets/app.js" defer></script>
  <script src="/assets/page-doctor.js?v=2" defer></script>
  <script src="/assets/page-game-doctor.js?v=4" defer></script>
</body>
</html>
